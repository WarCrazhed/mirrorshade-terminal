# cargo deny check — supply-chain policy for the Rust side.
[graph]
all-features = true

[advisories]
# Fail on known vulnerabilities; unmaintained crates are reported as warnings.
unmaintained = "workspace"
yanked = "deny"

[licenses]
confidence-threshold = 0.9
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "Zlib", "Unicode-3.0", "Unicode-DFS-2016", "MPL-2.0", "CC0-1.0", "BSL-1.0",
  "0BSD", "CDLA-Permissive-2.0", "OpenSSL", "Unlicense", "MIT-0",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
# Only crates.io; no git dependencies.
unknown-registry = "deny"
unknown-git = "deny"
