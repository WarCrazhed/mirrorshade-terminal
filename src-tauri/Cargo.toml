[package]
name = "mirrorshade"
version = "0.1.0"
description = "Mirrorshade Terminal — private AI terminal"
authors = ["WarCrazhed"]
license = "MIT"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mirrorshade_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.43", features = ["bundled"] }
nucleo-matcher = "0.3"
regex = "1"
toml = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
tokio = { version = "1", features = ["sync", "time", "macros"] }

keyring = { version = "3", features = ["apple-native"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
# Already in the tree via tao; used to read the NSWindow number for the blur radius.
objc2 = "0.6"

[features]
default = []
# Claude API (cloud). Off by default: the 100% local build doesn't even contain this code.
cloud-ai = ["dep:keyring"]

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "time"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
